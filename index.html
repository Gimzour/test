<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jérôme Kerviel & Société Générale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --accent-color: #00f2fe;
            --text-color: #e2e8f0;
            --card-bg: rgba(18, 24, 38, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Effet de lumière en arrière-plan */
        body::before {
            content: '';
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.05) 0%, rgba(0,0,0,0) 70%);
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* En-tête avec la Météo */
        header {
            width: 100%;
            max-width: 950px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1.5rem;
            z-index: 2;
        }

        .weather-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 0.5rem 1rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        /* Citation */
        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
            margin-bottom: 2rem;
        }

        .quote-icon {
            font-size: 3rem;
            color: var(--accent-color);
            opacity: 0.3;
            line-height: 1;
            margin-bottom: 0.5rem;
            font-family: 'Cinzel', serif;
        }

        blockquote {
            font-size: clamp(1.1rem, 2.2vw, 1.6rem);
            font-weight: 300;
            line-height: 1.5;
            letter-spacing: -0.01em;
            margin-bottom: 1.5rem;
            font-style: italic;
            color: #f8fafc;
        }

        .author {
            display: inline-block;
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent-color);
            position: relative;
            padding-top: 1rem;
        }

        .author::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
        }

        /* Section du graphique boursier */
        .chart-container {
            max-width: 950px;
            width: 100%;
            height: 450px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            z-index: 1;
        }

        .tradingview-widget-container, .tradingview-widget-container__widget {
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Widget Météo en haut à droite -->
    <header>
        <div class="weather-card">
            <a class="weatherwidget-io" href="https://forecast7.com/fr/48d892d29/levallois-perret/" data-label_1="LEVALLOIS-PERRET" data-label_2="Météo" data-font="Helvetica" data-icons="Climacons Animated" data-theme="dark" data-basecolor="transparent" data-accent="rgba(255,255,255,0.1)" data-textcolor="#e2e8f0" data-highcolor="#00f2fe" data-lowcolor="#94a3b8" data-suncolor="#ffb703" data-mooncolor="#00f2fe" data-cloudcolor="#94a3b8" data-raincolor="#00f2fe" style="display: block; width: 220px; height: 40px;">LEVALLOIS-PERRET Météo</a>
            <script>
            !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src='https://weatherwidget.io/js/widget.min.js';fjs.parentNode.insertBefore(js,fjs);}}(document,'script','weatherwidget-io-js');
            </script>
        </div>
    </header>

    <!-- Citation de Jérôme Kerviel -->
    <main class="container">
        <div class="quote-icon">“</div>
        <blockquote>
            « C'est là que tout le pognon se fait, sous un bon stress, avec beaucoup d'adrénaline, un truc hyper rythmé et actif, enthousiasmant, challengeant, à proximité de têtes très bien faites. »
        </blockquote>
        <div class="author">Jérôme Kerviel</div>
    </main>

    <!-- Widget Bourse Société Générale -->
    <div class="chart-container">
        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
            {
                "width": "100%",
                "height": "100%",
                "symbol": "EURONEXT:GLE",
                "interval": "D",
                "timezone": "Europe/Paris",
                "theme": "dark",
                "style": "3",
                "locale": "fr",
                "allow_symbol_change": false,
                "calendar": false,
                "support_host": "https://www.tradingview.com"
            }
            </script>
        </div>
    </div>

</body>
</html>
